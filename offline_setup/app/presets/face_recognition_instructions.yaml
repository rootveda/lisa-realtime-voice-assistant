# Fallback copy when repo docs path unavailable (see docs/face_recognition_instructions.yaml).
version: 1
known_person_prefix: |
  [People context — known faces present: {names}. Primary focus: {primary}.]
unknown_person_prefix: |
  [People context — identity unknown for this frame; stay polite and generic.]
multi_person_note: |
  Multiple people may be visible; keep replies inclusive.
broadcast_assistant_turns: true
greeting_hint: |
  You may greet {primary_name} naturally if appropriate.
memory_snippet_lines: 8
memory_label: "Earlier with this person (excerpt):"
speaker_focus_note: |
  Active speaker detection from audio is not enabled; dialogue follows visual primary.

enrollment_cta_line: |
  Local enrollment: use /face-manager or POST /api/face/person to name this person_id.

assistant_enrollment_note: |
  This stack stores face data in a local SQLite registry. Operators enroll via /face-manager or POST /api/face/person — not through chat.

  If the user asks to save or enroll their face: do not deny that storage exists or claim biometrics cannot be saved on this deployment; explain that you cannot run enrollment yourself in chat unless tools are enabled, and direct them to Face manager or an operator.
